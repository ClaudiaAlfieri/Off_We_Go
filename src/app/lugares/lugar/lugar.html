<div class="p-6 max-w-lg mx-auto bg-white shadow-lg rounded-lg mt-6">
  <h2 class="text-2x1 font-semibold text-gray-700 mg-4">Nova Categoria</h2>
  <hr/>
  <form class="lugarForm" [formGroup]="camposForm" (ngSubmit)="salvar()">
    <div class="mb-4">
      <label for="nome" class="block text-gray-600 font-medium mb-2">Nome</label>
      <input
        type="text"
        id="nome"
        name="nome"
        formControlName="nome"
        placeholder="Ex: Praia do Sol, Restaurante Estrela."
        class="w-full p-3 border border-gray-300 rounded shadow-sm focus:ring focus:ring-blue-400"
        required />
    </div>

    <div class="mb-4">
      <label for="categoria" class="block text-gray-600 font-medium mb-2">Categoria</label>
    </div>

     <div class="mb-4">
      <label for="categoria" class="block text-gray-600 font-medium mb-2">Localização</label>
      <input
        type="text"
        id="localização"
        name="localização"
        formControlName="localização"
        placeholder="Ex: São Paulo, Rio de Janeiro, etc."
        class="w-full p-3 border border-gray-300 rounded shadow-sm focus:ring focus:ring-blue-400"
        required />
    </div>

     <div class="mb-4">
      <label for="categoria" class="block text-gray-600 font-medium mb-2">URL da Foto</label>
      <input
        type="text"
        id="urlFoto"
        name="urlFoto"
        formControlName="urlFoto"
        placeholder="Ex: https://example.com/foto.jpg"
        class="w-full p-3 border border-gray-300 rounded shadow-sm focus:ring focus:ring-blue-400"
        required />
    </div>

     <div class="mb-4">
      <label for="categoria" class="block text-gray-600 font-medium mb-2">Avaliação</label>
    </div>


    <button type="submit" class="w-full bg-blue-600 rounded-md py-2 px-4 text-white font-semibold hover:bg-blue-700">
      Cadastrar Lugar
    </button>


  </form>
</div>
