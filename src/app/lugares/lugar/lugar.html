<div class="p-6 max-w-lg mx-auto bg-white shadow-lg rounded-lg mt-6">
  <h2 class="text-2x1 font-semibold text-gray-700 mg-4">Novo Lugar</h2>
  <hr/>
  <form class="lugarForm" [formGroup]="camposForm" (ngSubmit)="salvar()">
    <div class="mb-4">
      <label for="nome" class="block text-gray-600 font-medium mb-2">Nome</label>
      <input
        type="text"
        id="nome"
        name="nome"
        formControlName="nome"
        placeholder="Ex: Praia do Sol, Restaurante Estrela."
        class="w-full p-3 border border-gray-300 rounded shadow-sm focus:ring focus:ring-blue-400"
        required />
    </div>

    <div class="mb-4">
      <label for="categoria" class="block text-gray-600 font-medium mb-2">Categoria</label>
      <select
        id="categoria"
        name="categoria"
        formControlName="categoria"
        class="w-full p-3 border border-gray-300 rounded shadow-sm focus:outline-none focus:ring focus:ring-blue-400"
        required>
        <option [value]="">Selecione uma categoria</option>
        <option *ngFor="let cat of categorias" [value]="cat.nome">
          {{ cat.nome }}
        </option>
      </select>
    </div>

     <div class="mb-4">
      <label for="categoria" class="block text-gray-600 font-medium mb-2">Localização</label>
      <input
        type="text"
        id="localização"
        name="localização"
        formControlName="localização"
        placeholder="Ex: São Paulo, Rio de Janeiro, etc."
        class="w-full p-3 border border-gray-300 rounded shadow-sm focus:ring focus:ring-blue-400"
        required />
    </div>

     <div class="mb-4">
      <label for="categoria" class="block text-gray-600 font-medium mb-2">Foto</label>
      <input
        type="text"
        id="urlFoto"
        name="urlFoto"
        formControlName="urlFoto"
        placeholder="Ex: https://example.com/foto.jpg"
        class="w-full p-3 border border-gray-300 rounded shadow-sm focus:ring focus:ring-blue-400"
        required />
    </div>

     <div class="mb-4">
      <label for="categoria" class="block text-gray-600 font-medium mb-2">Avaliação</label>
       <select
        id="avaliacao"
        name="avaliacao"
        formControlName="avaliacao"
        class="w-full p-3 border border-gray-300 rounded shadow-sm focus:outline-none focus:ring focus:ring-blue-400"
        required>
        <option [value]="">Selecione uma nota</option>
        <option [value]="1">1 - Ruim</option>
        <option [value]="2">2 - Regular</option>
        <option [value]="3">3 - Bom</option>
        <option [value]="4">4 - Muito Bom</option>
        <option [value]="5">5 - Excelente</option>
      </select>
    </div>

    <button type="submit" class="w-full bg-blue-600 rounded-md py-2 px-4 text-white font-semibold hover:bg-blue-700">
      Cadastrar Lugar
    </button>

  </form>
</div>
